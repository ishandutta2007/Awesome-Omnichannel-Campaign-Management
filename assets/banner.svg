<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05" />
    </linearGradient>

    <!-- Channel Card Gradients -->
    <linearGradient id="card-email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="card-sms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="card-push" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="card-inapp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="card-whatsapp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="card-webhook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseFlow {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes orbitPath {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }

      .float-1 { animation: floatSlow1 4.5s ease-in-out infinite; }
      .float-2 { animation: floatSlow2 5.2s ease-in-out infinite; }
      .float-3 { animation: floatSlow3 4.8s ease-in-out infinite; }
      .pulse-line { stroke-dasharray: 8 6; animation: pulseFlow 2.4s linear infinite; }
      .g-pulse { animation: glowPulse 6s ease-in-out infinite; transform-origin: center; }

      .card-rect { rx: 14; stroke-width: 1.2; backdrop-filter: blur(8px); }
      .card-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f3f4f6; }
      .card-sub { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 10px; fill: #9ca3af; }

      .main-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .tagline-pill {
        font-family: 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- 2. Decorative Cyber Grids & Radial Glows (Background layer) -->
  <circle cx="200" cy="80" r="180" fill="url(#glow-grad)" class="g-pulse" />
  <circle cx="1020" cy="300" r="220" fill="url(#glow-grad)" class="g-pulse" style="animation-delay: -3s;" />

  <!-- Background Journey Network Lines -->
  <g opacity="0.35">
    <path d="M 80,60 Q 300,120 500,40 T 900,100 T 1150,50" fill="none" stroke="#6366f1" stroke-width="1.5" class="pulse-line" />
    <path d="M 60,320 Q 350,260 620,330 T 1120,310" fill="none" stroke="#ec4899" stroke-width="1.5" class="pulse-line" style="animation-direction: reverse; animation-duration: 3s;" />
  </g>

  <!-- 3. Dynamic Animated Channel Cards (Placed around the canvas edges, non-intrusive) -->
  
  <!-- Left Side Channel Cards -->
  <!-- Email Card -->
  <g class="float-1" transform="translate(60, 48)">
    <rect width="140" height="52" fill="url(#card-email)" stroke="#38bdf8" class="card-rect" filter="url(#card-shadow)" />
    <circle cx="26" cy="26" r="13" fill="#0284c7" />
    <!-- Mail Icon -->
    <path d="M 19 21 L 26 27 L 33 21 M 19 21 L 19 31 L 33 31 L 33 21 Z" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="24" class="card-title">Email Flows</text>
    <text x="48" y="38" class="card-sub">Event-Driven</text>
  </g>

  <!-- SMS / RCS Card -->
  <g class="float-2" transform="translate(45, 140)">
    <rect width="146" height="52" fill="url(#card-sms)" stroke="#10b981" class="card-rect" filter="url(#card-shadow)" />
    <circle cx="26" cy="26" r="13" fill="#059669" />
    <!-- Chat Bubble Icon -->
    <path d="M 20 23 C 20 20.8 22.7 19 26 19 C 29.3 19 32 20.8 32 23 C 32 25.2 29.3 27 26 27 C 24.8 27 23.7 26.6 22.8 26 L 20 27 L 20.6 24.8 C 20.2 24.3 20 23.7 20 23 Z" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="24" class="card-title">SMS &amp; RCS</text>
    <text x="48" y="38" class="card-sub">Real-Time Delivery</text>
  </g>

  <!-- In-App Card -->
  <g class="float-3" transform="translate(60, 235)">
    <rect width="140" height="52" fill="url(#card-inapp)" stroke="#a855f7" class="card-rect" filter="url(#card-shadow)" />
    <circle cx="26" cy="26" r="13" fill="#7c3aed" />
    <!-- Layers / Device Icon -->
    <path d="M 20 21 L 26 18 L 32 21 L 26 24 Z M 20 25 L 26 28 L 32 25 M 20 29 L 26 32 L 32 29" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="24" class="card-title">In-App Modals</text>
    <text x="48" y="38" class="card-sub">SDK Nudges</text>
  </g>

  <!-- Right Side Channel Cards -->
  <!-- Push Card -->
  <g class="float-2" transform="translate(1000, 48)">
    <rect width="140" height="52" fill="url(#card-push)" stroke="#f59e0b" class="card-rect" filter="url(#card-shadow)" />
    <circle cx="26" cy="26" r="13" fill="#d97706" />
    <!-- Bell Icon -->
    <path d="M 26 19 C 24 19 22.5 20.5 22.5 22.5 C 22.5 25 21 26 21 27 L 31 27 C 31 26 29.5 25 29.5 22.5 C 29.5 20.5 28 19 26 19 Z M 24.5 29 C 24.5 29.8 25.2 30.5 26 30.5 C 26.8 30.5 27.5 29.8 27.5 29" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
    <text x="48" y="24" class="card-title">Mobile Push</text>
    <text x="48" y="38" class="card-sub">APNs / FCM</text>
  </g>

  <!-- WhatsApp Card -->
  <g class="float-1" transform="translate(1010, 140)">
    <rect width="146" height="52" fill="url(#card-whatsapp)" stroke="#22c55e" class="card-rect" filter="url(#card-shadow)" />
    <circle cx="26" cy="26" r="13" fill="#16a34a" />
    <!-- WhatsApp / Phone Icon -->
    <path d="M 21 21 C 21 27 25 31 31 31 L 31 28 L 29 26 L 27 27 C 25 25 24 24 23 22 L 24 20 L 22 18 Z" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
    <text x="48" y="24" class="card-title">WhatsApp API</text>
    <text x="48" y="38" class="card-sub">Conversational</text>
  </g>

  <!-- Webhook / CDP Card -->
  <g class="float-3" transform="translate(1000, 235)">
    <rect width="142" height="52" fill="url(#card-webhook)" stroke="#ec4899" class="card-rect" filter="url(#card-shadow)" />
    <circle cx="26" cy="26" r="13" fill="#db2777" />
    <!-- Webhook Connector Icon -->
    <circle cx="22" cy="26" r="2.5" fill="#ffffff" />
    <circle cx="30" cy="21" r="2.5" fill="#ffffff" />
    <circle cx="30" cy="31" r="2.5" fill="#ffffff" />
    <path d="M 24.5 25 L 28 22 M 24.5 27 L 28 30" stroke="#ffffff" stroke-width="1.3" />
    <text x="48" y="24" class="card-title">Webhooks &amp; CDP</text>
    <text x="48" y="38" class="card-sub">Temporal DAGs</text>
  </g>

  <!-- 4. Foreground Content (Title, Badges, Subtitle) - High z-index, centered, perfectly clear -->
  <g id="foreground-hero" transform="translate(600, 175)" text-anchor="middle">
    <!-- Category Pill -->
    <g transform="translate(0, -95)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1" />
      <circle cx="-142" cy="0" r="4" fill="#38bdf8" />
      <text x="8" y="4" class="tagline-pill">CUSTOMER JOURNEY ORCHESTRATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-30" class="main-title" fill="url(#title-grad)" filter="url(#neon-glow)">
      Awesome Omnichannel
    </text>
    <text x="0" y="16" class="main-title" fill="#ffffff">
      Campaign Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="62" class="subtitle">
      Curated Ecosystem of Cross-Channel Customer Journeys, Event Messaging &amp; Self-Hosted Platforms
    </text>

    <!-- Quick Stats Bar / Feature Highlights in Foreground -->
    <g transform="translate(0, 102)">
      <!-- Box 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="0.8" />
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">⚡ Event-Triggered</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="0.8" />
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">🛡️ Data Sovereign</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="0.8" />
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">🚀 Open Source</text>
      </g>
      <!-- Box 4 -->
      <g transform="translate(240, 0)">
        <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="0.8" />
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">🏢 Enterprise SaaS</text>
      </g>
    </g>
  </g>
</svg>
